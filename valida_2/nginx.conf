server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los assets hasheados (index-*.js / index-*.css) son content-addressed,
    # así que se cachean indefinidamente sin problema.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback para SPA: cualquier ruta que no exista devuelve index.html,
    # así react-router maneja todo el ruteo en el cliente (deep links, refresh).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
